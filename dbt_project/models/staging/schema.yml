version: 2

models:
  - name: stg_checkins
    description: Clean check-ins, one row per user, venue and timestamp.
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: ts_local
        data_tests: [not_null]
      - name: h3_r9
        data_tests: [not_null]

  - name: stg_friendships
    description: Friendships before and after the check-in period, one row per pair per snapshot.
    columns:
      - name: snapshot
        data_tests:
          - accepted_values:
              values: ["before", "after"]
