version: 2

models:
  - name: stg_checkins
    description: Clean Gowalla check-ins, one row per user, venue and timestamp.
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: ts_local
        data_tests: [not_null]
      - name: h3_r9
        data_tests: [not_null]

  - name: stg_friendships
    description: Friendships, one row per pair with user_a < user_b.
    columns:
      - name: user_a
        data_tests: [not_null]
      - name: user_b
        data_tests: [not_null]
