version: 2

models:
  - name: fct_user_activity
    description: One row per user, lifetime activity summary.
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: user_week_features
    description: >
      One row per user per week (weeks start Monday, local time).
      Weekly activity and movement features.
    columns:
      - name: user_week_key
        description: user_id and week combined; unique if the grain holds.
        data_tests: [unique, not_null]
      - name: user_id
        data_tests: [not_null]
      - name: week
        data_tests: [not_null]
      - name: checkins
        data_tests: [not_null]
      - name: active_days
        description: Number of different local dates with at least one check-in that week, 1 to 7.
      - name: unique_venues
        description: Number of different venues visited that week.
      - name: unique_h3_r9
        description: Number of different H3 resolution 9 cells visited, roughly how many separate places.
      - name: weekend_ratio
        description: Share of the week's check-ins on Saturday or Sunday, local time.
      - name: radius_km
        description: Radius of gyration in km, how far the user roams from their weekly centre.

  - name: meetups
    description: >
      One row per friend pair per venue per day where both friends checked in
      within 60 minutes of each other. Dates are UTC.
    columns:
      - name: meetup_key
        description: user_a, user_b, venue and date combined; unique if the grain holds.
        data_tests: [unique, not_null]
      - name: user_a
        description: The friend with the smaller user_id.
        data_tests: [not_null]
      - name: user_b
        description: The friend with the larger user_id.
        data_tests: [not_null]
      - name: met_at
        description: Earliest time of the meetup that day, UTC.
      - name: minutes_apart
        description: Smallest gap in minutes between the two friends' check-ins.
      - name: checkins_pairs
        description: How many check-in pairs matched; more than 1 means repeated check-ins that day.